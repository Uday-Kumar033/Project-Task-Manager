name: Task Manager CICD
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Renamed from 'test' to match your deployment dependency
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Confirm workflow is running
        run: echo "Task Manager CICD workflow started successfully"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: mruday033/task-manager-backend:latest

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: mruday033/task-manager-frontend:latest

  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build-and-push # This now successfully connects to the job above
    env:
      KUBECONFIG: /home/ubuntu/.kube/task-manager-config

    steps:
      - name: Verify Kubernetes access
        run: |
          kubectl get deployments -n task-manager

      - name: Update backend image
        run: |
          kubectl set image deployment/backend \
            backend=mruday033/task-manager-backend:latest \
            -n task-manager

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=mruday033/task-manager-frontend:latest \
            -n task-manager

      - name: Ensure latest images are pulled
        run: |
          kubectl patch deployment backend -n task-manager \
            --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"backend","imagePullPolicy":"Always"}]}}}}'

          kubectl patch deployment frontend -n task-manager \
            --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","imagePullPolicy":"Always"}]}}}}'

          kubectl rollout restart deployment/backend -n task-manager
          kubectl rollout restart deployment/frontend -n task-manager

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/backend \
            -n task-manager --timeout=180s

          kubectl rollout status deployment/frontend \
            -n task-manager --timeout=180s

          kubectl get pods -n task-manager
