apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-config
  namespace: task-manager
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "task_manager"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  # The frontend proxies /api requests through Nginx, so browser requests are same-origin.
  # Change this only if you later call the API directly from another origin.
  FRONTEND_ORIGIN: "http://localhost:5173"
